# Override only: ALWAYS pass compose.yaml first. Running this file alone omits
# DB_HOST, auth settings, ports, and dependency services from the base config.
# docker compose -f compose.yaml -f compose.dev.yaml up --build --wait
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate && exec npm run start:dev -- --path tsconfig.dev.json",
      ]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api:/app
      - api_dev_node_modules:/app/node_modules
      - api_dev_build:/app/.dev-build

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - web_dev_node_modules:/app/node_modules
      - web_dev_next:/app/.next

volumes:
  api_dev_node_modules:
  api_dev_build:
  web_dev_node_modules:
  web_dev_next:
