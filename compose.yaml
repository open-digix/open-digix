services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digix}
      POSTGRES_DB: ${POSTGRES_DB:-digix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      # Keep the public issuer, but publish reachable internal JWKS/token URLs
      # to services fetching discovery over the Compose network.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *"200"* ]]'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      WEED_ADMIN_USER: ${SEAWEEDFS_ADMIN_USER:-admin}
      WEED_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:?Set SEAWEEDFS_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
      - "127.0.0.1:${SEAWEEDFS_ADMIN_PORT:-12535}:12535"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://127.0.0.1:9333/cluster/healthz >/dev/null &&
          code=$$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8333/) &&
          { [ "$$code" = "200" ] || [ "$$code" = "403" ]; } &&
          curl --fail --silent --show-error http://127.0.0.1:12535/login >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  api:
    build: ./apps/api
    command:
      ["sh", "-c", "node dist/database/migrate.js && exec node dist/main.js"]
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-digix}
      DB_NAME: ${POSTGRES_DB:-digix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/digix}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-digix-api}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/digix/protocol/openid-connect/certs}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  gateway:
    image: apache/apisix:3.13.0-debian
    environment:
      # APISIX 3.13 requires client_secret in the OIDC schema even in JWKS-only
      # bearer mode; it is not used for token verification or introspection.
      GATEWAY_OIDC_CLIENT_SECRET: ${GATEWAY_OIDC_CLIENT_SECRET:?Set a local random value in .env}
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3001}:9080"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # The APISIX image does not include curl/wget; check the routed endpoint via bash TCP.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *"200"* ]]'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  auth-demo-seed:
    profiles: ["demo"]
    build: ./apps/api
    command:
      [
        "sh",
        "-c",
        "node dist/database/migrate.js && exec node dist/dev/provision-auth-demo.js",
      ]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-digix}
      DB_NAME: ${POSTGRES_DB:-digix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/digix}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: digix
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_ADMIN_PASSWORD}
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-dung.demo}
      # Keep normal Compose commands usable without the optional demo profile.
      # The provisioner fails fast if this is empty when auth-demo-seed runs.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-dung.demo@example.test}
      DEMO_USER_DISPLAY_NAME: ${DEMO_USER_DISPLAY_NAME:-Dung Demo}
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-tenant_alpha}
      DEMO_TENANT_NAME: ${DEMO_TENANT_NAME:-Tenant Alpha}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://gateway:9080
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-digix-web}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-http://localhost:8080/realms/digix}
      AUTH_KEYCLOAK_INTERNAL_URL: ${AUTH_KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_postgres_data:
  object_storage_data:
